serenity {
    take.screenshots = FOR_FAILURES
    use.unique.browser = false
    test.root = co.edu.udea.buggyrating
    console.colors = true

    report {
        accessibility = true
    }

    requirement {
        types = "epic, feature"
    }
}

webdriver {
    driver = chrome
    autodownload = true

    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
    }
}

chrome.switches = """--start-maximized;
                     --test-type;
                     --no-sandbox;
                     --ignore-certificate-errors;
                     --disable-popup-blocking;
                     --disable-default-apps;
                     --disable-extensions-file-access-check;
                     --incognito;
                     --disable-infobars;
                     --disable-gpu;
                     --remote-allow-origins=*"""

pages {
    buggyUrl = "https://buggy.justtestit.org/"
}